      <div class="tabs" role="tablist" aria-label="Reference sections">

  <script src="assets/js/app.js"></script>
  <script src="assets/js/reference-data.js"></script>
  <script>
    (function () {
      "use strict";
      var panels = {
        formulas: { el: document.getElementById("panelFormulas"), data: window.EL_REF.formulas, tab: document.getElementById("tabFormulas"), card: refFormulaCard },
        shortcuts: { el: document.getElementById("panelShortcuts"), data: window.EL_REF.shortcuts, tab: document.getElementById("tabShortcuts"), card: refShortcutCard },
        glossary: { el: document.getElementById("panelGlossary"), data: window.EL_REF.glossary, tab: document.getElementById("tabGlossary"), card: refGlossaryCard }
      };
      var current = "formulas";
      var searchEl = document.getElementById("refSearch");
      var emptyEl = document.getElementById("refEmpty");

      function refFormulaCard(f) {
        return '<div class="card ref-card"><h3>' + escHtml(f.name)
          + (f.version ? '<span class="ver-tag">' + escHtml(f.version) + "</span>" : "") + "</h3>"
          + '<code class="fx">' + escHtml(f.syntax) + "</code>"
          + '<p>' + escHtml(f.meaning) + "</p></div>";
      }
      function refShortcutCard(s) {
        return '<div class="card ref-card"><h3><kbd>' + escHtml(s.keys) + "</kbd>" + (s.cat ? '<span class="ref-cat">' + escHtml(s.cat) + "</span>" : "") + "</h3>"
          + "<p>" + escHtml(s.action) + "</p></div>";
      }
      function refGlossaryCard(g) {
        return '<div class="card ref-card"><h3>' + escHtml(g.term) + (g.cat ? '<span class="ref-cat">' + escHtml(g.cat) + "</span>" : "") + "</h3>"
          + "<p>" + escHtml(g.meaning) + "</p></div>";
      }

      function render() {
        var q = searchEl.value.trim().toLowerCase();
        var p = panels[current];
        var words = q.split(/\s+/);
        var items = p.data.filter(function (x) {
          var hay = Object.keys(x).map(function (k) { return x[k]; }).join(" ").toLowerCase();
          return words.every(function (w) { return hay.indexOf(w) !== -1; });
        });
        p.el.innerHTML = items.map(p.card).join("");
        emptyEl.classList.toggle("hidden", items.length > 0);
      }

      Object.keys(panels).forEach(function (key) {
        panels[key].tab.addEventListener("click", function () {
          current = key;
          Object.keys(panels).forEach(function (k) {
            var on = k === current;
            panels[k].el.classList.toggle("hidden", !on);
            panels[k].el.hidden = !on;
            panels[k].tab.classList.toggle("active", on);
            panels[k].tab.setAttribute("aria-selected", on ? "true" : "false");
          });
          render();
        });
      });

      var t = null;
      searchEl.addEventListener("input", function () {
        clearTimeout(t);
        t = setTimeout(render, 120);
      });
      var q = qParam("tab");
      if (q && panels[q]) panels[q].tab.click();
      render();
    })();
  </script>
